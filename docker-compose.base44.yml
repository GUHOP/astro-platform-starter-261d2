services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - BASE44_PREVIEW_MODE=1
      - PUBLIC_DISABLE_UPLOADS=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx astro dev --host 0.0.0.0 --port 4321"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
